<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#33284E">
<title>登录 · 同频 SAME FREQ</title>
<style>
:root{
  --ink:#1D1730; --ink-2:#4A4160; --ink-soft:#7A7290; --ink-mute:#A69FBB;
  --accent:#6C4AB6; --accent-2:#9B7EDE; --accent-soft:#F0EBFB;
  --pink:#E85A8A; --line:#EFEBF7; --line-2:#E4DEF1;
  --err:#E04141; --ok:#3FA98A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,sans-serif;
  background:#F7F5FB;color:var(--ink);-webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit;color:inherit}

.phone{
  width:100%;max-width:430px;margin:0 auto;height:100dvh;background:#fff;
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:560px){
  body{background:linear-gradient(140deg,#1B1526,#3A2B58 60%,#5A3E85);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:26px 16px}
  .phone{
    height:min(898px,calc(100dvh - 52px));border-radius:46px;border:11px solid #150F1F;
    box-shadow:0 34px 90px rgba(0,0,0,.45);
  }
  .phone::after{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:#150F1F;z-index:30;pointer-events:none}
}

/* 顶部品牌条 */
.brandbar{
  flex-shrink:0;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#33284E,#4A3878 55%,#6C4AB6);color:#EFEAFB;
  padding:calc(46px + env(safe-area-inset-top)) 24px 34px;
}
.brandbar::after{content:"";position:absolute;right:-70px;bottom:-90px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(232,90,138,.45),transparent 66%)}
.brandbar::before{content:"";position:absolute;left:-60px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(155,126,222,.35),transparent 66%)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:1px;position:relative;z-index:1}
.logo .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#E85A8A,#9B7EDE);display:flex;align-items:center;justify-content:center;font-size:15px}
.brandbar h1{font-size:24px;line-height:1.42;letter-spacing:1px;margin:20px 0 0;position:relative;z-index:1}
.brandbar h1 em{font-style:normal;background:linear-gradient(120deg,#F0A3C4,#C4ABF5);-webkit-background-clip:text;background-clip:text;color:transparent}
.brandbar p{font-size:12.5px;opacity:.72;margin-top:9px;line-height:1.75;position:relative;z-index:1;max-width:300px}
.bstats{display:flex;gap:28px;margin-top:20px;position:relative;z-index:1}
.bstats b{display:block;font-size:19px;font-weight:800}
.bstats span{font-size:10.5px;opacity:.6;letter-spacing:1.5px}

/* 表单区 */
.body{flex:1;overflow-y:auto;padding:28px 24px calc(30px + env(safe-area-inset-bottom))}
.body::-webkit-scrollbar{width:0}
.card{width:100%}
.card h2{font-size:21px;font-weight:800;letter-spacing:1.5px}
.card .sub{color:var(--ink-soft);font-size:12.5px;margin:7px 0 24px}

.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.5px;margin-bottom:7px}
.input-wrap{display:flex;border:1.5px solid var(--line-2);border-radius:14px;background:#fff;overflow:hidden;transition:.2s}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,74,182,.1)}
.input-wrap.error{border-color:var(--err)}
.prefix{display:flex;align-items:center;gap:5px;padding:0 6px 0 14px;font-size:14px;color:var(--ink-soft);border-right:1.5px solid var(--line);background:#FBFAFE}
.input-wrap input{flex:1;border:none;outline:none;padding:13px 14px;font-size:16px;color:var(--ink);letter-spacing:1px;min-width:0;background:none}
.input-wrap input::placeholder{color:#C6BFD6;font-size:13.5px;letter-spacing:0}

.code-row{display:flex;gap:9px}
.code-row .input-wrap{flex:1}
.code-btn{
  flex-shrink:0;border:none;cursor:pointer;font-size:13px;font-weight:700;
  padding:0 18px;border-radius:14px;background:var(--accent);color:#fff;transition:.2s;letter-spacing:.5px;
}
.code-btn:disabled{background:#D8D2E8;color:#fff;cursor:not-allowed}

.field-err{font-size:11.5px;color:var(--err);margin-top:6px;display:none;line-height:1.6}
.field-err.show{display:block}

.agree{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink-soft);margin:6px 0 20px;line-height:1.65}
.agree input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.agree a{color:var(--accent)}

.submit{
  width:100%;border:none;cursor:pointer;background:linear-gradient(120deg,var(--accent),var(--pink));color:#fff;
  font-size:16px;font-weight:700;letter-spacing:4px;padding:14px;border-radius:14px;
  transition:.25s;box-shadow:0 6px 20px rgba(108,74,182,.32);
}
.submit:active{transform:scale(.985)}
.submit:disabled{opacity:.6;cursor:not-allowed}
.submit.loading{letter-spacing:1px}

.tips{
  margin-top:22px;padding:12px 14px;border-radius:12px;font-size:11.5px;line-height:1.8;
  background:#FDF3E7;color:#9A6B1F;border:1.5px dashed #E8C89A;
}
.tips b{font-weight:700}

/* 成功页 */
.success{display:none;text-align:center}
.success .check{
  width:72px;height:72px;margin:14px auto 18px;border-radius:50%;
  background:linear-gradient(135deg,#3FA98A,#7CC5A5);display:flex;align-items:center;justify-content:center;
  font-size:32px;color:#fff;box-shadow:0 10px 26px rgba(63,169,138,.32);animation:bounce .6s ease;
}
@keyframes bounce{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.success h2{font-size:21px;letter-spacing:1.5px}
.success .sub2{margin:9px 0 22px;color:var(--ink-soft);font-size:12.5px}
.user-box{background:#fff;border:1.5px solid var(--line-2);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.user-box .row{display:flex;justify-content:space-between;font-size:12.5px;gap:12px}
.user-box .row span:first-child{color:var(--ink-soft);flex-shrink:0}
.user-box .row span:last-child{font-weight:600;text-align:right;word-break:break-all}
.ghost{
  width:100%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;
  padding:12px;border-radius:14px;font-size:14px;color:var(--ink);transition:.2s;
}
.ghost:active{border-color:var(--accent);color:var(--accent)}

.toast{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(29,23,48,.92);color:#EFEAFB;padding:11px 20px;border-radius:99px;font-size:12.5px;
  letter-spacing:.5px;box-shadow:0 10px 28px rgba(0,0,0,.3);transition:.35s cubic-bezier(.2,.9,.3,1.3);
  opacity:0;z-index:99;max-width:86%;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div class="phone">

  <div class="brandbar">
    <div class="logo"><span class="dot">🎵</span>同频 SAME FREQ</div>
    <h1>看演出这件事，<br><em>不该一个人去。</em></h1>
    <p>找到同校一起冲那场演唱会的人，认识全校和你听同一位歌手的人。</p>
    <div class="bstats">
      <div><b>1,286</b><span>已认证同学</span></div>
      <div><b>3</b><span>覆盖高校</span></div>
      <div><b>128</b><span>成功组队</span></div>
    </div>
  </div>

  <div class="body">
    <!-- ===== 登录表单 ===== -->
    <div class="card" id="login-card">
      <h2>手机号登录</h2>
      <p class="sub">首次登录自动注册 · 仅支持在校生手机号</p>

      <div class="field">
        <label>手机号</label>
        <div class="input-wrap" id="phone-wrap">
          <span class="prefix">+86</span>
          <input id="phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="tel">
        </div>
        <div class="field-err" id="phone-err"></div>
      </div>

      <div class="field">
        <label>验证码</label>
        <div class="code-row">
          <div class="input-wrap" id="code-wrap">
            <input id="code" type="tel" maxlength="6" placeholder="6 位短信验证码" autocomplete="one-time-code">
          </div>
          <button class="code-btn" id="send-btn" onclick="sendCode()">获取验证码</button>
        </div>
        <div class="field-err" id="code-err"></div>
      </div>

      <label class="agree">
        <input type="checkbox" id="agree">
        <span>我已阅读并同意 <a>《用户协议》</a> 和 <a>《隐私政策》</a>，并知悉平台为校园认证社区，禁止代抢与加价转票。</span>
      </label>

      <button class="submit" id="login-btn" onclick="login()">登 录</button>

      <div class="tips">
        💡 <b>开发模式提示</b>：当前未接入真实短信通道，点击「获取验证码」后验证码会直接显示在页面提示与服务器控制台中，可自动填入完成登录。生产环境替换短信服务商即可。
      </div>
    </div>

    <!-- ===== 登录成功 ===== -->
    <div class="card success" id="success-card">
      <div class="check">✓</div>
      <h2 id="s-title">登录成功</h2>
      <p class="sub2" id="s-sub">欢迎加入同频</p>
      <div class="user-box">
        <div class="row"><span>昵称</span><span id="u-nickname">—</span></div>
        <div class="row"><span>手机号</span><span id="u-phone">—</span></div>
        <div class="row"><span>用户 ID</span><span id="u-id">—</span></div>
        <div class="row"><span>注册时间</span><span id="u-created">—</span></div>
        <div class="row"><span>会话令牌</span><span id="u-token" style="font-size:10.5px">—</span></div>
      </div>
      <button class="ghost" style="border:none;background:linear-gradient(120deg,#6C4AB6,#E85A8A);color:#fff;margin-bottom:10px;font-weight:700" onclick="goHome()">进入同频主站 →</button>
      <button class="ghost" onclick="backToLogin()">切换其他账号</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// 同源部署时用当前域名；若直接双击本地文件打开（file://），自动回退到本地后端
const API = /^https?:$/.test(location.protocol) ? location.origin : 'http://localhost:3000';
const APP_HOME = (/^https?:$/.test(location.protocol) ? '' : 'http://localhost:3000') + '/';
function goHome(){ location.href = APP_HOME; }

/* ---------- 提示 ---------- */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),3200);
}
function fieldErr(wrapId, errId, msg){
  document.getElementById(wrapId).classList.toggle('error',!!msg);
  const e=document.getElementById(errId);
  e.textContent=msg||'';e.classList.toggle('show',!!msg);
}

/* ---------- 输入校验 ---------- */
const phoneInput=document.getElementById('phone');
phoneInput.addEventListener('input',()=>{phoneInput.value=phoneInput.value.replace(/\D/g,'');fieldErr('phone-wrap','phone-err')});
const codeInput=document.getElementById('code');
codeInput.addEventListener('input',()=>{codeInput.value=codeInput.value.replace(/\D/g,'');fieldErr('code-wrap','code-err')});
document.getElementById('agree').addEventListener('change',e=>{if(e.target.checked)fieldErr('code-wrap','code-err')});

/* ---------- 发送验证码 ---------- */
let counting=false;
async function sendCode(){
  if(counting)return;
  fieldErr('phone-wrap','phone-err');
  fieldErr('code-wrap','code-err');
  const phone=phoneInput.value.trim();
  if(!/^1[3-9]\d{9}$/.test(phone)){
    fieldErr('phone-wrap','phone-err','请输入正确的 11 位手机号');phoneInput.focus();return;
  }
  if(!document.getElementById('agree').checked){
    fieldErr('code-wrap','code-err','请先勾选并同意用户协议');return;
  }
  const btn=document.getElementById('send-btn');
  btn.disabled=true;btn.textContent='发送中…';
  try{
    const r=await fetch(API+'/api/auth/send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
    const d=await r.json();
    if(!d.ok){throw new Error(d.msg||'发送失败')}
    // 开发模式：把验证码直接亮出来（生产环境删除此段）
    toast(`开发模式验证码：${d.devCode}`);
    codeInput.value=d.devCode;  // 开发模式自动填充，便于演示；生产环境删除
    fieldErr('code-wrap','code-err',`开发模式：本次验证码为 ${d.devCode}，5 分钟内有效`);
    countdown(60);
  }catch(err){
    btn.disabled=false;btn.textContent='获取验证码';
    if(err instanceof TypeError){
      fieldErr('code-wrap','code-err',`连不上后端服务，请确认已运行 node server.js（当前地址 ${API}）`);
      toast('连不上后端服务，请先启动 server.js');
    }else{
      fieldErr('code-wrap','code-err',err.message);
    }
  }
}
function countdown(sec){
  counting=true;
  const btn=document.getElementById('send-btn');
  btn.textContent=`${sec}s 后重发`;
  const t=setInterval(()=>{
    sec--;
    if(sec<=0){clearInterval(t);counting=false;btn.disabled=false;btn.textContent='重新获取';}
    else btn.textContent=`${sec}s 后重发`;
  },1000);
}

/* ---------- 登录 ---------- */
async function login(){
  const phone=phoneInput.value.trim();
  const code=codeInput.value.trim();
  fieldErr('phone-wrap','phone-err');fieldErr('code-wrap','code-err');
  let bad=false;
  if(!/^1[3-9]\d{9}$/.test(phone)){fieldErr('phone-wrap','phone-err','请输入正确的 11 位手机号');bad=true}
  if(!/^\d{6}$/.test(code)){fieldErr('code-wrap','code-err','请输入 6 位验证码');bad=true}
  if(!document.getElementById('agree').checked){toast('请先同意用户协议');return}
  if(bad)return;

  const btn=document.getElementById('login-btn');
  btn.disabled=true;btn.classList.add('loading');btn.textContent='验证中…';
  try{
    const r=await fetch(API+'/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,code})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.msg||'登录失败');
    localStorage.setItem('sf_token',d.token);
    localStorage.setItem('sf_user',JSON.stringify(d.user));
    showSuccess(d.user,d.token,d.msg);
  }catch(err){
    btn.disabled=false;btn.classList.remove('loading');btn.textContent='登 录';
    if(err instanceof TypeError){
      fieldErr('code-wrap','code-err',`连不上后端服务，请确认已运行 node server.js（当前地址 ${API}）`);
      toast('连不上后端服务，请先启动 server.js');
    }else{
      fieldErr('code-wrap','code-err',err.message);
    }
  }
}

/* ---------- 成功页 ---------- */
function showSuccess(user,token,msg){
  document.getElementById('login-card').style.display='none';
  document.getElementById('success-card').style.display='block';
  document.getElementById('s-title').textContent=msg||'登录成功';
  document.getElementById('s-sub').textContent='下面是你的账户信息（来自 /api/me 实时校验）';
  fetch(API+'/api/me',{headers:{'Authorization':'Bearer '+token}})
    .then(r=>r.json())
    .then(d=>{
      if(!d.ok)throw new Error();
      const u=d.user;
      document.getElementById('u-nickname').textContent=u.nickname;
      document.getElementById('u-phone').textContent=u.phone_masked;
      document.getElementById('u-id').textContent='No.'+String(u.id).padStart(5,'0');
      document.getElementById('u-created').textContent=new Date(u.created_at).toLocaleString('zh-CN');
      document.getElementById('u-token').textContent=token.slice(0,20)+'…';
    })
    .catch(()=>toast('会话校验失败，请重新登录'));
}

/* ---------- 已登录则直接展示账户页 ---------- */
(async function(){
  const t=localStorage.getItem('sf_token');
  if(!t)return;
  try{
    const r=await fetch(API+'/api/me',{headers:{'Authorization':'Bearer '+t}});
    const d=await r.json();
    if(d.ok){showSuccess(d.user,t,'欢迎回来')}
    else{localStorage.removeItem('sf_token');localStorage.removeItem('sf_user')}
  }catch(e){}
})();

/* ---------- 切换账号 ---------- */
async function backToLogin(){
  const token=localStorage.getItem('sf_token');
  if(token){
    try{await fetch(API+'/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+token}});}catch(e){}
  }
  localStorage.removeItem('sf_token');
  localStorage.removeItem('sf_user');
  document.getElementById('success-card').style.display='none';
  document.getElementById('login-card').style.display='block';
  codeInput.value='';
  const btn=document.getElementById('login-btn');
  btn.disabled=false;btn.classList.remove('loading');btn.textContent='登 录';
  toast('已退出登录，可以换个账号');
}
</script>
</body>
</html>
